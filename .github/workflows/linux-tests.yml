name: Linux tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    env:
      # Fail every test skip caused by a missing tool, module or golden (see tests/run_tests.py).
      UPROF_REQUIRE_TOOLS: '1'
      # Same release as the Windows MSI; the trace goldens hold verbatim LLVM tool output.
      LLVM_VERSION: '23.1.4'
      # sha256 of LLVM-23.1.4-Linux-X64.tar.zst from the llvmorg-23.1.4 release.
      LLVM_SHA256: efdd1dbd089b99bfcfcde7b8eb1236163f2e88df5a981cca4f783ec9cb5e0378
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DuckDB
        run: python -m pip install duckdb==2.0.0

      - name: Install LLVM
        run: |
          archive="LLVM-$LLVM_VERSION-Linux-X64"
          wget -qO "$RUNNER_TEMP/$archive.tar.zst" "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$archive.tar.zst"
          echo "$LLVM_SHA256  $RUNNER_TEMP/$archive.tar.zst" | sha256sum -c -
          tools="llvm-symbolizer llvm-objdump llvm-readobj llvm-pdbutil"
          sudo tar -I "zstd -d --long=31" -xf "$RUNNER_TEMP/$archive.tar.zst" -C /usr/local/bin --strip-components=2 $(for tool in $tools; do echo "$archive/bin/$tool"; done)
          rm "$RUNNER_TEMP/$archive.tar.zst"
          for tool in $tools; do
            if [ ! -x "/usr/local/bin/$tool" ]; then
              echo "::error::$tool is missing from $archive"
              exit 1
            fi
          done
          llvm-objdump --version

      - name: Require the pinned LLVM version
        run: |
          for tool in llvm-symbolizer llvm-objdump llvm-readobj llvm-pdbutil; do
            found=$("$tool" --version | awk '/LLVM version/ {print $NF; exit}')
            if [ "$found" != "$LLVM_VERSION" ]; then
              echo "::error::$tool reports LLVM $found, expected $LLVM_VERSION; the trace goldens hold its verbatim output"
              exit 1
            fi
          done

      - name: Require --no-symbolize-operands
        run: |
          if ! llvm-objdump --help | grep -q -- '--no-symbolize-operands'; then
            echo "::error::llvm-objdump lacks --no-symbolize-operands; the LLVM-gated tests would skip"
            exit 1
          fi

      - name: Run tests
        run: python tests/run_tests.py
